<script>let jobs=[],remoteCalls=[],devices=[],groups=[],selfLabel='算力设备1';
function allCalls(){return jobs.concat(remoteCalls);}
    function summaryText(text){
      let value=String(text||'').replace(/^（附图）/,'').replace(/^【(?:子任务\s+\d+\/\d+|任务拆分|合并结果)】/,'');
      const marker=value.match(/(?:^|\n)(?:User task:|## User request|Original question:|用户请求：|原始问题：)\s*\n/);
      if(marker)value=value.slice(marker.index+marker[0].length).split('\n')[0];
      else if(/\n|^(?:You are|# Role|Return |System:|Developer:|把用户请求拆成|下面是同一个用户请求)/i.test(value))value='推理请求';
      value=value.replace(/\s+/g,' ').trim()||'推理请求';
      return value.length>80?value.slice(0,80)+'…':value;
    }
    function morphNode(current,next){
      if(current.nodeType!==next.nodeType||current.nodeName!==next.nodeName){current.replaceWith(next);return;}
      if(current.nodeType===3){if(current.data!==next.data)current.data=next.data;return;}
      if(current.nodeType!==1)return;
      for(const attribute of Array.from(current.attributes))if(!next.hasAttribute(attribute.name))current.removeAttribute(attribute.name);
      for(const attribute of Array.from(next.attributes))if(current.getAttribute(attribute.name)!==attribute.value)current.setAttribute(attribute.name,attribute.value);
      const children=Array.from(next.childNodes);
      for(let index=0;index<children.length;index++){
        if(current.childNodes[index])morphNode(current.childNodes[index],children[index]);else current.appendChild(children[index]);
      }
      while(current.childNodes.length>children.length)current.lastChild.remove();
    }
    function renderMarkup(view,html){
      if(view.innerHTML===html)return;
      const top=view.scrollTop||0;
      const template=document.createElement('template');
      if(!template.content||!view.insertBefore){view.innerHTML=html;view.scrollTop=top;return;}
      template.innerHTML=html;
      const key=node=>node.getAttribute('data-row-key')||node.getAttribute('data-filter')||'';
      const old=Array.from(view.children), keyed=new Map(old.filter(key).map(node=>[key(node),node]));
      const viewTop=view.getBoundingClientRect().top;
      const anchor=top>0?old.find(node=>key(node)&&node.getBoundingClientRect().bottom>viewTop):null;
      const anchorOffset=anchor?anchor.getBoundingClientRect().top-viewTop:0;
      const used=new Set();
      Array.from(template.content.children).forEach((next,index)=>{
        const current=key(next)?keyed.get(key(next)):(old[index]&&!key(old[index])?old[index]:null);
        const node=current&&!used.has(current)?current:next;
        if(node!==next)morphNode(node,next);
        if(view.children[index]!==node)view.insertBefore(node,view.children[index]||null);
        used.add(node);
      });
      for(const node of old)if(!used.has(node))node.remove();
      const desired=anchor&&anchor.isConnected?view.scrollTop+anchor.getBoundingClientRect().top-viewTop-anchorOffset:top;
      if(Math.abs(view.scrollTop-desired)>.5)view.scrollTop=desired;
    }
    function groupRunning(group){return group.phase==='running'||group.phase==='merging';}
    function esc(text){
      return String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function publicJobName(name, role){
      const text=String(name||'');
      if(text==='本机'||text.indexOf('算力设备')===0||text.indexOf('聊天设备')===0) return text;
      return role==='chat'?'聊天设备':'算力设备';
    }
    function computeKindLabel(device){
      const caps=device&&device.capabilities;
      if(Array.isArray(caps)&&caps.length){
        if(caps.includes('text')&&caps.includes('vision'))return '文本+图片';
        if(caps.includes('vision'))return '图片';
        if(caps.includes('text'))return '文本';
        return '类型待同步';
      }
      // Older peers may only report a model; explicit capabilities always take precedence.
      const model=device&&typeof device.model==='string'?device.model.trim():'';
      if(/vl|vision/i.test(model))return '图片';
      return model?'文本':'类型待同步';
    }
    function isLlamaCluster(device){
      return !!device&&device.inferenceBackend==='llama.cpp';
    }
    function computePublicName(device){
      const name=publicJobName(device&&device.name,'compute');
      return isLlamaCluster(device)?(name==='本机'?'算力集群':name.replace(/^算力设备/,'算力集群')):name;
    }
    function computeModelName(device){
      const reported=device&&typeof device.model==='string'?(device.model.trim()||'无可用模型'):'模型待同步';
      return reported.replace(/^(.+?-\d+(?:\.\d+)?B)-.+$/i,'$1').replace(/^Qwen3-Next-80B$/i,'Qwen3-80B');
    }
    function computeDisplayName(device){
      return computePublicName(device)+'-'+computeModelName(device);
    }
    function computeCardTitle(device){
      return '<span class="flow-device-title" title="'+esc(computeDisplayName(device))+'"><span class="flow-device-name">'+esc(computePublicName(device))+'</span><span class="flow-device-model">'+esc(computeModelName(device))+'</span></span>';
    }
    function jobKey(job){
      return String(job.key||job.id||'');
    }
    const flowView=document.getElementById('collaboration');
    const historyControls=document.getElementById('historyControls');
    const viewSwitch=document.getElementById('taskViewSwitch');
    let taskView='flow',queuedCalls=[],mirroredCalls=[],flowSignature='',flowItems=[],flowStatusHeight=0;
    const flowSeen=new Map(),flowFlights=new Map();
    function flowClock(ms){
      const seconds=Math.max(0,Math.floor(ms/1000));
      const pad=n=>String(n).padStart(2,'0');
      return (seconds>=3600?pad(Math.floor(seconds/3600))+':':'')+pad(Math.floor(seconds/60)%60)+':'+pad(seconds%60);
    }
    function flowIcon(kind){return '<svg class="flow-type" aria-hidden="true"><use href="#flow-task-'+(kind==='image'?'image':'text')+'"/></svg>';}
    function flowPhoto(image){
      return typeof image==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(image)?image:'';
    }
    function flowTitle(item){
      return item.question||((item.kind==='image'?'图片':'文本')+'任务');
    }
    function resolveFlowDevice(id,label,compute){
      const candidates=devices.filter(device=>(device.role==='self'||device.role==='compute')===compute);
      if(id)return candidates.find(device=>device.id===id)||null;
      const matches=candidates.filter(device=>device.name===label||(device.role==='self'&&label==='本机'&&compute));
      return matches.length===1?matches[0]:null;
    }
    function flowState(item){
      if(item.phase==='waiting-send')return '等待发送';
      if(item.phase==='sending')return '正在上传';
      if(item.stage==='hub-queued')return '中心等待分派';
      if(!item.executor||item.phase==='routing')return '等待分派';
      if(item.phase==='queued')return '等待执行';
      return ({preparing:'准备模型',loading:'加载模型',prefill:'处理输入',generating:'生成中'})[item.stage]||'执行中';
    }
    function flowData(){
      const now=Date.now(),items=[];
      for(const job of allCalls().concat(queuedCalls,mirroredCalls)){
        if(!job.running&&!['queued','waiting-send'].includes(job.phase))continue;
        // The ingress is never an executor fallback. Only explicit acceptance/flow evidence draws hop two.
        const assigned=!!job.source||!!job.executorId;
        const executor=assigned?(job.executionBackend==='cloud'?{id:'cloud-executor'}:resolveFlowDevice(job.executorId,job.source,true)):null;
        const origin=resolveFlowDevice(job.originId,job.origin,false),key=jobKey(job);
        const phase=job.phase||'running';
        const item={key,jobKey:job.key&&job.key.indexOf('mirror:')===0?undefined:key,
          kind:job.kind||((job.image||/^（附图）/.test(job.question||''))?'image':'text'),
          question:summaryText(job.question||''),image:flowPhoto(job.image),model:job.executionBackend==='cloud'?(job.executionModel||'云端模型'):'',
          phase,stage:job.stage||'',at:job.phaseStartedAt||job.startedAt||now,origin:origin&&origin.id,
          executor:executor&&executor.id,gateway:(resolveFlowDevice(job.executorId,job.source,true)||{}).id,
          notice:job.routeNotice&&now-job.routeNoticeAt<8000?job.routeNotice:'',noticeAt:job.routeNoticeAt};
        items.push(item);
        const previous=flowSeen.get(key);
        if(item.executor&&phase!=='sending'&&phase!=='waiting-send'&&phase!=='routing'&&
          (!previous||previous.executor!==item.executor)&&
          (previous||phase==='queued'||now-(job.startedAt||0)<2000)){
          flowFlights.set(key,{...item,until:now+1200});
        }
        flowSeen.set(key,{executor:item.executor,phase});
      }
      // Remove an old target immediately on reassignment, cancellation, or a return to the router.
      for(const [key,flight] of flowFlights){
        const current=items.find(item=>item.key===key);
        if(flight.until<=now||!current||current.executor!==flight.executor||
          ['sending','routing','waiting-send'].includes(current.phase))flowFlights.delete(key);
      }
      const liveKeys=new Set(items.map(item=>item.key));
      for(const key of flowSeen.keys())if(!liveKeys.has(key))flowSeen.delete(key);
      return items;
    }
    function flowCard(item){
      const action=item.jobKey?' data-flow-detail="'+esc(item.jobKey)+'"':'';
      const title=flowTitle(item),state=flowState(item),working=item.phase==='running'&&!!item.executor;
      const media=item.image?'<img class="flow-photo" alt="" src="'+item.image+'">':flowIcon(item.kind);
      return '<'+(action?'button':'div')+' class="flow-task'+(working?' working':' waiting')+'" data-row-key="'+esc(item.key)+'"'+
        (action?' type="button"'+action:'')+' aria-label="'+esc(title+' · '+state)+'">'+media+
        '<span><span class="flow-question">'+esc(title)+'</span><small class="flow-state">'+esc(state)+'</small>'+
        (item.model?'<small class="flow-model">'+esc(item.model)+'</small>':'')+'</span><b data-flow-clock="'+esc(item.key)+'">'+flowClock(Date.now()-item.at)+'</b></'+(action?'button':'div')+'>';
    }
    function renderFlow(){
      if(!flowView)return;
      flowItems=flowData();
      const computers=devices.filter(device=>device.role==='self'||device.role==='compute');
      const chats=devices.filter(device=>device.role!=='self'&&device.role!=='compute');
      const sources=chats.slice();
      if(flowItems.some(item=>!item.origin))sources.push({id:'local-source',name:'本机 / 未知来源',ready:true});
      const width=Math.max(960,(flowView.clientWidth||1024)-44);
      const spread=width/960;flowView.style.setProperty('--flow-spread',spread);
      const left=320*spread,rowWidth=width-left-18;
      const cloudActive=flowItems.filter(item=>item.executor==='cloud-executor');
      const executionNodes=cloudActive.length?computers.concat([{id:'cloud-executor',name:'云端推理',role:'cloud',ready:true,jobs:cloudActive.length}]):computers;
      let top=8;const rows=executionNodes.map(device=>{
        const active=flowItems.filter(item=>item.executor===device.id&&!['sending','routing','waiting-send'].includes(item.phase));
        const delegated=cloudActive.filter(item=>item.gateway===device.id).length;
        const busy=active.some(item=>item.phase==='running')||(!active.length&&Math.max(0,(typeof device.jobs==='number'?device.jobs:0)-delegated)>0);
        const height=Math.max(device.ready?344:384,96+Math.max(1,active.length)*184),row={device,active,busy,y:top,height};top+=height+36;return row;
      });
      const waiting=flowItems.filter(item=>!item.executor||['sending','routing','waiting-send'].includes(item.phase));
      const notices=flowItems.filter(item=>item.notice);
      const height=Math.max(460,top-24,sources.length*180,flowStatusHeight?300+flowStatusHeight*2:0),center=height/2;
      const sourceY=new Map(sources.map((source,i)=>[source.id,(i+.5)*height/Math.max(1,sources.length)]));
      const targetY=new Map(rows.map(row=>[row.device.id,row.y+row.height/2]));
      const sourcePath=y=>'M'+(68*spread+52)+' '+y+'H'+(158*spread-10)+'Q'+(158*spread)+' '+y+' '+(158*spread)+' '+(y+(y<center?12:-12))+'V'+(center+(y<center?-12:12))+'Q'+(158*spread)+' '+center+' '+(158*spread+10)+' '+center+'H'+(232*spread-42);
      const targetPath=y=>'M'+(232*spread+42)+' '+center+'H'+(310*spread-10)+'Q'+(310*spread)+' '+center+' '+(310*spread)+' '+(center+(y<center?-12:12))+'V'+(y+(y<center?12:-12))+'Q'+(310*spread)+' '+y+' '+(310*spread+10)+' '+y+'H'+left;
      const flights=Array.from(flowFlights.values());
      for(const item of flowItems.filter(item=>item.phase==='sending'))if(!flights.some(flight=>flight.key===item.key))flights.push(item);
      const activeSource=new Set(flights.filter(item=>item.phase==='sending').map(item=>item.origin||'local-source')),activeTarget=new Set(flights.filter(item=>item.phase!=='sending').map(item=>item.executor));
      const signature=JSON.stringify({width,height,computers,sources,items:flowItems.map(item=>[item.key,item.kind,item.phase,item.stage,item.at,item.origin,item.executor,item.gateway,item.model||'',item.question||'',item.image?1:0,item.notice]),flights:flights.map(item=>[item.key,item.origin,item.executor])});
      if(signature!==flowSignature){
        flowSignature=signature;
        const wires='<svg class="flow-wires" viewBox="0 0 '+width+' '+height+'" aria-hidden="true"><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>'+
          sources.map(source=>'<path class="flow-wire '+(activeSource.has(source.id)?'active':'')+'" d="'+sourcePath(sourceY.get(source.id))+'" marker-end="url(#flow-arrow)"/>').join('')+
          rows.map(row=>'<path data-flow-target="'+esc(row.device.id)+'" class="flow-wire '+(row.device.role==='cloud'?'cloud ':'')+(activeTarget.has(row.device.id)?'active':'')+'" d="'+targetPath(targetY.get(row.device.id))+'" marker-end="url(#flow-arrow)"/>').join('')+'</svg>';
        const phones=sources.map(source=>'<div class="flow-phone" data-row-key="source:'+esc(source.id)+'" style="left:'+(68*spread-60)+'px;top:'+(sourceY.get(source.id)-58)+'px"><svg aria-hidden="true"><use href="#flow-phone"/></svg><span>'+esc(source.id==='local-source'?'本机 / 未知来源':publicJobName(source.name,'chat'))+'</span></div>').join('');
        const router='<div class="flow-router '+(flights.length?'active':'')+'" style="left:'+(232*spread-42)+'px;top:'+(center-35)+'px"><svg aria-hidden="true" viewBox="0 0 48 36"><rect x="2" y="13" width="10" height="10" rx="2"/><rect x="35" y="2" width="10" height="10" rx="2"/><rect x="35" y="24" width="10" height="10" rx="2"/><path d="M12 18h9q4 0 4-4v-3q0-4 4-4h6M21 18q4 0 4 4v3q0 4 4 4h6"/></svg><span>路由中心<br>('+esc(computePublicName(computers.find(device=>device.name==='算力设备1')||{name:'算力设备1'}))+')</span></div>';
        const boxes=rows.map(row=>{
          const d=row.device;
          if(d.role==='cloud')return '<section class="flow-compute flow-cloud" data-row-key="cloud-executor" style="left:'+left+'px;top:'+row.y+'px;width:'+rowWidth+'px;min-height:'+row.height+'px" aria-label="云端路由"><div class="flow-computer"><svg class="flow-cloud-icon" viewBox="0 0 100 72" aria-hidden="true"><path d="M25 57h52a15 15 0 0 0 1-30 25 25 0 0 0-48-7 18 18 0 0 0-5 37Z"/><path d="M39 39h22m-7-7 7 7-7 7"/></svg><span>云端推理</span><small>已路由至云端</small></div><div class="flow-lane busy"><h3>'+ (row.busy?'执行中':'等待执行')+' · '+row.active.length+' 个任务</h3>'+row.active.map(flowCard).join('')+'</div></section>';
          if(d.pendingInfo)return '<section class="flow-compute is-pending" data-row-key="compute:'+esc(d.id)+'" style="left:'+left+'px;top:'+row.y+'px;width:'+rowWidth+'px;min-height:'+row.height+'px" aria-label="算力设备，信息待同步"><div class="flow-computer"><div class="flow-pc-mark"><svg aria-hidden="true"><use href="#flow-pc"/></svg></div><span>算力设备</span><small>已计入在线总数</small></div><div class="flow-lane"><h3>信息待同步</h3><p class="flow-pending-note">等待路由中心同步<br>设备名称与模型</p></div></section>';
          const mem=typeof d.memUsage==='number'&&Number.isFinite(d.memUsage)&&d.memUsage>=0?Math.min(100,d.memUsage):null;
          const memory='<div class="flow-memory" aria-label="内存 '+(mem===null?'未采集':mem+'%')+'"><i><em style="width:'+(mem===null?0:mem)+'%;background:'+(mem>50?'#e1b43b':'#279a73')+'"></em></i><span>内存<b>'+(mem===null?'—':Math.round(mem)+'%')+'</b></span></div>';
          return '<section class="flow-compute'+(row.busy?' is-computing':'')+'" data-row-key="compute:'+esc(d.id)+'" style="left:'+left+'px;top:'+row.y+'px;width:'+rowWidth+'px;min-height:'+row.height+'px" aria-label="'+esc(computeDisplayName(d))+'"><div class="flow-computer"><div class="flow-pc-mark"><svg aria-hidden="true"><use href="#'+(isLlamaCluster(d)?'flow-cluster':'flow-pc')+'"/></svg>'+(d.role==='self'&&!isLlamaCluster(d)?'<span class="flow-pc-local">本机</span>':'')+'</div>'+computeCardTitle(d)+memory+(!d.ready?'<small>连接中</small>':'')+'</div><div class="flow-lane'+(row.busy?' busy':'')+'"><h3>'+((row.busy?'执行中':row.active.length?'等待执行':'在线')+'-'+computeKindLabel(d))+'</h3>'+row.active.map(flowCard).join('')+(!row.active.length&&row.busy?'<span class="flow-idle">设备忙碌 · 无任务明细</span>':'')+'</div></section>';
        }).join('');
        const routerStatus='<aside class="flow-router-status" style="left:'+(142*spread)+'px;top:'+(center+140)+'px;width:'+(168*spread)+'px" aria-live="polite">'+
          notices.slice(-2).map(item=>'<p class="flow-route-notice" data-row-key="notice:'+esc(item.key)+'"><b>任务改派</b>'+esc(item.notice)+'</p>').join('')+
          waiting.slice(0,3).map(item=>'<div class="flow-router-task" data-row-key="waiting:'+esc(item.key)+'" aria-label="'+esc(flowTitle(item)+' · '+flowState(item))+'">'+flowIcon(item.kind)+'<strong>'+esc(flowState(item))+'</strong><span>'+esc(flowTitle(item))+'</span><small data-flow-clock="'+esc(item.key)+'">'+flowClock(Date.now()-item.at)+'</small></div>').join('')+
          (waiting.length>3?'<p class="flow-queue-more">另有 '+(waiting.length-3)+' 个任务等待</p>':'')+'</aside>';
        const packets=flights.filter(item=>item.phase==='sending'||targetY.has(item.executor)).map(item=>{
          const upload=item.phase==='sending',y=sourceY.get(item.origin||'local-source')||center;
          const route=upload?sourcePath(y):targetPath(targetY.get(item.executor));
          return '<div class="flow-packet" data-flow-leg="'+(upload?'ingress':'executor')+'" data-flow-target="'+esc(upload?'router':item.executor)+'" data-row-key="packet:'+esc(item.key)+'" aria-label="'+(item.kind==='image'?'图片':'文本')+(upload?'任务正在上传至路由中心':'任务正在分派至执行设备')+'" style="offset-path:path(\''+route+'\')">'+flowIcon(item.kind)+'</div>';
        }).join('');
        renderMarkup(flowView,'<div class="flow-labels" data-row-key="labels"><span>任务发起</span><span>路由分发</span><span>算力执行</span></div><div class="flow-scene" data-row-key="scene" style="width:'+width+'px;height:'+height+'px">'+wires+phones+router+routerStatus+boxes+packets+(!computers.length?'<div class="flow-empty">等待算力设备上线</div>':'')+'</div>');
      }
      // Measure the waiting panel so a burst of queued tasks cannot extend outside the fitted scene.
      const panel=flowView.querySelector&&flowView.querySelector('.flow-router-status');
      const panelHeight=panel?Math.ceil(panel.offsetHeight):0;
      if(Math.abs(panelHeight-flowStatusHeight)>1){flowStatusHeight=panelHeight;flowSignature='';renderFlow();return;}
      updateFlowClocks();
    }
    function updateFlowClocks(){
      if(!flowView||!flowView.querySelectorAll)return;
      const times=new Map(flowItems.map(item=>[item.key,item.at]));
      for(const element of flowView.querySelectorAll('[data-flow-clock]')){
        const at=times.get(element.getAttribute('data-flow-clock'));if(at!==undefined)element.textContent=flowClock(Date.now()-at);
      }
    }

const viewport=document.getElementById('viewport'),stage=document.getElementById('stage'),space=document.getElementById('space');
function fitFlow(){
 const width=viewport.clientWidth,height=viewport.clientHeight;
 if(width<=0||height<=0)return;
 const widthScale=Math.min(1,width/1000);
 // Keep the existing heading size at the normal width, then fit the whole diagram into both axes.
 stage.style.setProperty('--flow-scale',widthScale);
 let scale=Math.min(widthScale,height/Math.max(1,stage.scrollHeight));
 for(let pass=0;pass<3;pass++){
  const layoutWidth=Math.max(1000,width/scale);
  if(Math.abs((parseFloat(stage.style.width)||1000)-layoutWidth)>.5){
   stage.style.width=layoutWidth+'px';flowView.style.width=layoutWidth+'px';renderFlow();
  }
  const nextScale=Math.min(widthScale,height/Math.max(1,stage.scrollHeight));
  if(Math.abs(nextScale-scale)<.000001)break;
  scale=nextScale;
 }
 stage.style.transform='scale('+scale+')';stage.style.left='0px';
 space.style.width=width+'px';space.style.height=height+'px';
}
window.onNativeEvent=function(event){devices=event.devices||[];jobs=event.jobs||[];groups=[];queuedCalls=event.queuedCalls||[];mirroredCalls=event.flowCalls||[];renderFlow();fitFlow();};
window.addEventListener('resize',()=>{flowSignature='';renderFlow();fitFlow();});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitFlow).observe(viewport);
flowView.addEventListener('click',event=>{const button=event.target.closest('[data-flow-detail]');if(!button)return;
 const job=jobs.concat(queuedCalls).find(j=>jobKey(j)===button.getAttribute('data-flow-detail'));if(!job)return;
 document.getElementById('detailText').textContent=(job.question||'推理请求')+'\n执行设备：'+(job.source||'等待分派')+'\n状态：'+flowState(flowItems.find(item=>item.key===jobKey(job))||{phase:job.phase,executor:job.source,stage:job.stage});
 document.getElementById('detail').hidden=false;
});
document.getElementById('closeDetail').addEventListener('click',()=>document.getElementById('detail').hidden=true);
setInterval(()=>{renderFlow();fitFlow();},500);renderFlow();fitFlow();
</script></body></html>
